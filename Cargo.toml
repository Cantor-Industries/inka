[workspace]
resolver = "2"
members = ["crates/inka", "crates/inka-launcher", "crates/inka-runtime", "crates/inka-runtime-stub", "crates/inka-bundler"]

# `panic = "unwind"` (the default, set explicitly) so the runtime's exported ABI
# entry points can `catch_unwind` and the launcher/runtime temp-tree guards can
# run on a panic instead of aborting the host process.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
