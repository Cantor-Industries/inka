[workspace]
resolver = "2"
members = ["crates/inka", "crates/inka-format", "crates/inka-launcher", "crates/inka-runtime", "crates/inka-runtime-stub", "crates/inka-bundler", "crates/inka-desktop-shim"]

# Temporary local patch for Deno's Node compat. See vendor/deno_node/README.inka.md.
# deno_node 0.198.0 is the latest published crate (Deno 2.9.8); the upstream
# fix has not landed yet.
[patch.crates-io]
deno_node = { path = "vendor/deno_node" }

# `panic = "unwind"` (the default, set explicitly) so the runtime's exported ABI
# entry points can `catch_unwind` and the launcher/runtime temp-tree guards can
# run on a panic instead of aborting the host process.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
