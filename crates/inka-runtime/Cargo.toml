[package]
name = "inka-runtime"
license = "MIT"
version = "0.5.4"
edition = "2021"
publish = false

[lib]
name = "inka_runtime"
crate-type = ["cdylib"]

[dependencies]
async-trait = "=0.1.73"
deno_ast = { version = "=0.53.3", features = ["cjs"] }
deno_cache_dir = "=0.50.0"
deno_core = "=0.411.0"
deno_error = "=0.7.1"
deno_graph = "=0.111.0"
deno_runtime = { version = "=0.266.0", features = ["transpile"] }
deno_semver = "=0.10.1"
futures = "0.3"
import_map = "=0.25.0"
node_resolver = "=0.96.0"
serde_json = "1"
sys_traits = { version = "=0.1.28", features = ["real", "libc", "filetime", "getrandom"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "process", "fs", "net", "io-util", "io-std", "macros", "signal"] }
url = "2"

[build-dependencies]
deno_core = "=0.411.0"
deno_runtime = { version = "=0.266.0", features = ["snapshot"] }
