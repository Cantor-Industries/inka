[package]
name = "inka-runtime"
license = "MIT"
version = "0.8.1"
edition = "2021"
publish = false

[lib]
name = "inka_runtime"
crate-type = ["cdylib"]

[features]
# Desktop (laufey backend) support: exports the laufey runtime ABI and boots a
# window + the app's serve. The heavy engine is shared across desktop apps.
desktop = [
    "dep:laufey",
    "dep:raw-window-handle",
    "dep:deno_media_type",
    "dep:notify",
]
# Test-only: compile the in-runtime `DesktopApi` e2e battery (see
# `scripts/ci/desktop-e2e.sh`). Not enabled in release builds.
desktop-e2e = ["desktop"]

[dependencies]
async-trait = "=0.1.73"
deno_ast = { version = "=0.53.3", features = ["cjs"] }
deno_cache_dir = "=0.51.0"
deno_config = "=0.109.0"
deno_core = "=0.412.0"
deno_error = "=0.7.1"
deno_graph = "=0.111.0"
deno_media_type = { version = "=0.4.0", optional = true }
deno_resolver = "=0.90.0"
deno_runtime = { version = "=0.267.0", features = ["transpile"] }
deno_semver = "=0.10.1"
deno_terminal = { version = "=0.2.3", features = ["colors"] }
import_map = "=0.25.0"
inka-format = { path = "../inka-format" }
laufey = { version = "=0.7.0", optional = true }
notify = { version = "=8.2.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
node_resolver = "=0.97.0"
oxc_resolver = "=11.24.3"
serde = { version = "1", features = ["derive"] }
sys_traits = { version = "=0.1.28", features = ["real", "filetime", "getrandom"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "process", "fs", "net", "io-util", "io-std", "macros", "signal"] }
url = "2"

# `sys_traits` needs a platform backend for `RealSys`: `libc` on unix, `winapi`
# on Windows (junction + windows-sys). Features are additive per target.
[target.'cfg(unix)'.dependencies]
sys_traits = { version = "=0.1.28", features = ["libc"] }

[target.'cfg(windows)'.dependencies]
sys_traits = { version = "=0.1.28", features = ["winapi"] }

[build-dependencies]
deno_core = "=0.412.0"
deno_runtime = { version = "=0.267.0", features = ["snapshot"] }
