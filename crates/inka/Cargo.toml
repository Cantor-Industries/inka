[package]
name = "inka"
license = "MIT"
version = "0.8.1"
edition = "2021"
publish = false

[[bin]]
name = "inka"
path = "src/main.rs"

[features]
# Bundling (rolldown). Not default so the fast CLI build stays lean; release
# builds enable it. Without it, `inka build` cannot bundle.
bundle = ["dep:inka-bundler"]

[dependencies]
serde_json = "=1.0.151"
jsonc-parser = { version = "=0.32.4", features = ["serde"] }
sha2 = "0.10"
libloading = "0.8"
# Embed the per-app desktop payload as a binary section (Deno's libsui).
libsui = "0.16"
# Hardened, dependency-only extraction of downloaded archives: `.zip` via the
# `zip` crate, `.tar.gz` via `flate2` + `tar` (no shelling out to `tar`).
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# Windows MSI authoring (pure Rust, cross-compiles from any host).
msi = "0.10"
cab = "0.6"
# Direct `cfb` access to re-sort MSI tables by string-pool id (msi 0.10 uses
# cfb 0.14); required for real msiexec to accept the database.
cfb = "0.14"
deno_terminal = { version = "=0.2.3", features = ["colors"] }
inka-bundler = { path = "../inka-bundler", optional = true }
inka-format = { path = "../inka-format" }
# `inka desktop --inspect`: the CDP multiplexer (vendored from Deno).
anyhow = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
fastwebsockets = { version = "^0.8.1", features = ["upgrade", "unstable-split"] }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
