[package]
name = "inka"
license = "MIT"
version = "0.4.0"
edition = "2021"
publish = false

[[bin]]
name = "inka"
path = "src/main.rs"

[features]
default = ["transpile"]
# Build-time TypeScript -> JavaScript compilation (deno_ast). Disable with
# --no-default-features to keep `inka` small; `--transpile` then errors.
transpile = ["dep:deno_ast"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
url = "2"
libloading = "0.8"
libc = "0.2"
deno_ast = { version = "=0.53.3", features = ["transpiling"], optional = true }
