[package]
name = "inka-desktop-shim"
license = "MIT"
version = "0.8.1"
edition = "2021"
publish = false

[lib]
name = "inka_desktop_shim"
crate-type = ["cdylib"]

[dependencies]
inka-format = { path = "../inka-format" }
sha2 = "0.10"
# Read the per-app payload embedded as the `inka` binary section (Deno's libsui).
libsui = "0.16"
# Load the shared runtime; same cross-platform loader Deno's `deno_napi` uses.
libloading = "0.8"
# Cross-platform advisory file lock for the extracted-payload cache.
fslock = "0.2"
