[package]
name = "inka-patcher"
license = "MIT"
version = "0.0.0"
edition = "2024"

# Seed-time package patching: convert CommonJS packages to engine-viable pure ESM
# inside the scratch node_modules during `inka pkg snapshot`.
#
# This is the ONLY crate that depends on the heavy rolldown/oxc stack, and it pins
# tokio ^1.52 (via rolldown) while inka-runtime pins tokio =1.47.1 — so it is its
# OWN (nested) workspace with an independent Cargo.lock, NOT a root-workspace
# member. Build it with the big-disk cargo home/target (like inka-runtime) from
# inside this directory:
#
#   CARGO_HOME=…/inka-cargo-home CARGO_TARGET_DIR=…/inka-build/target \
#     cargo build --release
#
# The `inka` CLI invokes it as a sibling binary ($INKA_PATCHER or next to the inka
# binary), so the fast default build of `crates/inka` never links rolldown.
#
# rolldown is pinned EXACT: upstream publishes the Rust crates as non-semver /
# undocumented and closes Rust-only issues. A bump is a deliberate, golden-tested
# change, not a routine update.

[workspace]

[dependencies]
rolldown = "=1.2.7"
rolldown_common = "=1.2.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
