# Continuous checks for pushed/PR code. Runs on GitHub-hosted runners (the
# self-hosted runner is reserved for releases) so it stays cheap and always
# has shellcheck available.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: bash -n (syntax)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --severity=error "${files[@]}"

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Deno pin drift
        run: scripts/ci/deno-pins.sh

      - name: Rust components
        run: rustup component add clippy rustfmt

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # Fast crates only; `inka-runtime` and the bundler (rolldown) are built,
      # linted, and contract-tested on the self-hosted runtime-ci workflow (see
      # .github/workflows/runtime-ci.yml).
      - name: Clippy (fast crates, deny warnings)
        run: |
          set -euo pipefail
          cargo clippy --locked -p inka --bin inka -p inka-launcher -p inka-runtime-stub -- -D warnings

      - name: Fast-crate tests
        run: |
          set -euo pipefail
          cargo test --locked -p inka --bin inka
          cargo build --locked -p inka-launcher -p inka-runtime-stub
