# Continuous checks for pushed/PR code. Runs on GitHub-hosted runners (the
# self-hosted runner is reserved for releases) so it stays cheap and always
# has shellcheck available.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: bash -n (syntax)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --severity=error "${files[@]}"
