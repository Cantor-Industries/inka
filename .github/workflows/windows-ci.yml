# Windows build/test on the GitHub-hosted `windows-latest` runner.
#
# The image already provides Rust, Visual Studio Build Tools (link.exe,
# ml64.exe), LLVM (libclang at `C:\Program Files\LLVM`), and PowerShell 7, so
# no runner provisioning is needed.

name: windows-ci

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rust components
        run: rustup component add clippy rustfmt

      - name: Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # Fast crates; `inka-runtime`/the bundler build in the heavy step below.
      - name: Clippy (fast crates, deny warnings)
        run: |
          cargo clippy --locked -p inka --bin inka -p inka-launcher `
            -p inka-runtime-stub -p inka-desktop-shim -p inka-format `
            --all-targets -- -D warnings

      - name: Fast-crate tests
        run: |
          cargo test --locked -p inka --bin inka
          cargo test --locked -p inka-format -p inka-launcher -p inka-desktop-shim

      # Heavy: V8 snapshot + laufey (bindgen). libclang must be discoverable.
      - name: Build runtime + toolchain (release)
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --locked --release -p inka-runtime --features desktop
          cargo build --locked --release -p inka --features bundle -p inka-launcher -p inka-desktop-shim

      # Rename the cdylib outputs to the released names and expose the runtime
      # to the launcher, mirroring the Linux release staging.
      - name: Stage runtime
        run: |
          $runtime = (Get-Content crates/inka-runtime/runtime-version -Raw).Trim()
          $bin = "target/release"
          # Not `$home`: PowerShell variable names are case-insensitive and
          # `$HOME` is a read-only automatic variable.
          $rtHome = Join-Path $env:RUNNER_TEMP "inka-runtime"
          New-Item -ItemType Directory -Force -Path $rtHome | Out-Null
          Copy-Item "$bin/inka_runtime.dll" "$rtHome/libinka_runtime-$runtime.dll"
          "INKA_RUNTIME_HOME=$rtHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          # A prerelease engine tuple is only selected in the beta channel.
          if ($runtime -match '-(beta|rc)\.') {
            "INKA_CHANNEL=beta" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Smoke (build + run an artifact)
        run: |
          $bin = "target/release"
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Set-Content -Path smoke/main.js -Value 'console.log("smoke-artifact");'
          & "$bin/inka.exe" build smoke/main.js -o smoke/hello.exe
          $out = & "smoke/hello.exe"
          if ($out -notmatch "smoke-artifact") {
            throw "artifact output missing: $out"
          }
          & "$bin/inka.exe" doctor

      # `inka desktop` packaging (no GUI launch): the backend is downloaded and
      # checksum-verified, the shim is embedded, and the portable `.zip` is
      # produced. `resolve_shim` expects the released shim name next to inka.exe.
      - name: Smoke (desktop packaging)
        run: |
          $bin = "target/release"
          Copy-Item "$bin/inka_desktop_shim.dll" "$bin/libinka_desktop_shim.dll" -Force
          New-Item -ItemType Directory -Force -Path deskapp | Out-Null
          Set-Content -Path deskapp/index.js -Value 'console.log("desk");'
          & "$bin/inka.exe" desktop deskapp/index.js --backend webview `
            --name DeskApp -o desk-dist
          foreach ($f in @("DeskApp.exe", "DeskApp.dll", "runtime-version")) {
            if (-not (Test-Path (Join-Path "desk-dist" $f))) {
              throw "desktop packaging missing $f"
            }
          }
          if (-not (Test-Path "desk-dist.zip")) { throw "missing desk-dist.zip" }
          if ((Get-Item "desk-dist/DeskApp.dll").Length -lt 1024) {
            throw "shim looks too small"
          }

      # Later: upload the toolchain zip + runtime dll + laufey zip as workflow
      # artifacts, and add a CEF packaging smoke.
