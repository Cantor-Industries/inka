# Release pipeline for inka.
#
# Triggered by every `v*` tag. On a self-hosted runner:
#   - `build`: builds the toolchain (inka, inka-launcher) and the heavy runtime,
#     stages a toolchain tarball + engine assets + versions.json, and smoke-tests
#     the whole release through install.sh (this job runs npm/deno, so it only
#     has `contents: read`).
#   - `publish`: a separate job with `contents: write` that only runs the
#     release action; it carries no untrusted package-manager code.
#
# Runner requirements:
#   - runs-on: self-hosted (a single runner, so both jobs share the filesystem
#     and the `/tmp/inka-release-<run_id>` stage path)
#   - the runner's own environment provides CARGO_HOME and CARGO_TARGET_DIR
#     (a big disk; the Deno runtime build is ~10-15 min and needs several GB).
#   - network (npm/deno for the smoke test).

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      # A stable path on the (single) self-hosted runner, shared with `publish`.
      STAGE: /tmp/inka-release-${{ github.run_id }}
      TARGET: x86_64-unknown-linux-gnu
    outputs:
      rel: ${{ steps.versions.outputs.rel }}
      runtime: ${{ steps.versions.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare dirs
        run: |
          set -euo pipefail
          : "${CARGO_TARGET_DIR:?CARGO_TARGET_DIR must be set on the runner}"
          : "${CARGO_HOME:?CARGO_HOME must be set on the runner}"
          mkdir -p "$CARGO_TARGET_DIR" "$STAGE"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          echo "CARGO_HOME=$CARGO_HOME"
          echo "STAGE=$STAGE"

      - name: Deno pin drift
        run: scripts/ci/deno-pins.sh

      - name: Discover versions
        id: versions
        run: |
          set -euo pipefail
          out="$(scripts/ci/version.sh "${GITHUB_REF_NAME}")"
          REL="$(printf '%s\n' "$out" | sed -n 's/^release=//p')"
          RUNTIME="$(printf '%s\n' "$out" | sed -n 's/^runtime=//p')"
          DENO="$(printf '%s\n' "$out" | sed -n 's/^deno=//p')"
          [ -n "$REL" ] && [ -n "$RUNTIME" ] && [ -n "$DENO" ] \
            || { echo "error: could not parse version.sh output" >&2; exit 1; }
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "REL=$REL" >> "$GITHUB_ENV"
          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "DENO=$DENO" >> "$GITHUB_ENV"
          echo "release=$REL runtime=$RUNTIME deno=$DENO"

      - name: Build toolchain
        run: |
          set -euo pipefail
          cargo build --locked --release -p inka --features bundle
          cargo build --locked --release -p inka-launcher

      - name: Build runtime (always; tuple = runtime-version)
        run: |
          set -euo pipefail
          cargo build --locked --release -p inka-runtime
          test -f "$CARGO_TARGET_DIR/release/libinka_runtime.so"

      - name: Stage release assets
        run: |
          set -euo pipefail
          BIN="$CARGO_TARGET_DIR/release"
          TC="inka-toolchain-${REL}-${TARGET}.tar.gz"

          # Toolchain binaries, packaged as one archive.
          cp "$BIN/inka" "$STAGE/inka"
          cp "$BIN/inka-launcher" "$STAGE/inka-launcher"
          chmod +x "$STAGE/inka" "$STAGE/inka-launcher"
          tar -czf "$STAGE/$TC" -C "$STAGE" inka inka-launcher

          # Engine asset (always published; consumers keep only newer tuples).
          cp "$BIN/libinka_runtime.so" "$STAGE/libinka_runtime-$RUNTIME.so"

          # The bootstrap script and the curated release notes. The notes carry
          # {{REL}}/{{RUNTIME}} placeholders (substituted here) and a leading
          # maintainer comment block that is stripped from the published body.
          # Both values are validated to [0-9A-Za-z.+~-] (version.sh), so they
          # are safe as sed replacement text.
          cp install.sh "$STAGE/install.sh"
          sed -e "s/{{REL}}/$REL/g" -e "s/{{RUNTIME}}/$RUNTIME/g" \
            RELEASE_NOTES.md \
            | sed '1,/^-->$/d' > "$STAGE/RELEASE_NOTES.md"

          # sha256 sidecars (bare hex, as the installer/update expect).
          for f in "$TC" "libinka_runtime-$RUNTIME.so"; do
            (cd "$STAGE" && sha256sum "$f" | awk '{print $1}' > "$f.sha256")
          done

          # machine-readable version/identity record
          RT_SHA="$(cat "$STAGE/libinka_runtime-$RUNTIME.so.sha256")"
          TC_SHA="$(cat "$STAGE/$TC.sha256")"
          cat > "$STAGE/versions.json" <<EOF
          {
            "release": "$REL",
            "toolchain": {
              "version": "$REL",
              "target": "$TARGET",
              "archive": "$TC",
              "sha256": "$TC_SHA"
            },
            "runtime": "$RUNTIME",
            "deno_runtime": "$DENO",
            "runtime_sha256": "$RT_SHA"
          }
          EOF
          echo "staged:"; ls -1 "$STAGE"

      - name: Smoke test (never publish a broken release)
        run: scripts/ci/smoke.sh "$STAGE"

  publish:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    env:
      STAGE: /tmp/inka-release-${{ github.run_id }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      # No checkout and no package-manager code here: only the publish action.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: inka ${{ needs.build.outputs.rel }}
          body_path: ${{ env.STAGE }}/RELEASE_NOTES.md
          draft: false
          files: |
            ${{ env.STAGE }}/inka-toolchain-${{ needs.build.outputs.rel }}-${{ env.TARGET }}.tar.gz
            ${{ env.STAGE }}/inka-toolchain-${{ needs.build.outputs.rel }}-${{ env.TARGET }}.tar.gz.sha256
            ${{ env.STAGE }}/libinka_runtime-${{ needs.build.outputs.runtime }}.so
            ${{ env.STAGE }}/libinka_runtime-${{ needs.build.outputs.runtime }}.so.sha256
            ${{ env.STAGE }}/versions.json
            ${{ env.STAGE }}/install.sh
