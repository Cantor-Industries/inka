# Release pipeline for inka.
#
# Triggered by every `v*` tag.
#   - `build` (self-hosted Linux): builds the toolchain (inka, inka-launcher,
#     shim) and the desktop runtime, stages a toolchain tarball + engine assets +
#     versions.json, and smoke-tests the release through install.sh.
#   - `build-windows` (self-hosted Windows): builds the Windows toolchain + core
#     runtime (no `desktop` feature), stages a toolchain `.zip` + runtime `.dll`
#     + install.ps1, and merges `versions.json` into a per-target map.
#   - `publish` (self-hosted Linux, contents: write): attaches both platforms.
#
# Runner requirements:
#   - Both self-hosted runners are on the same machine and share one stage
#     directory, exposed to each as `INKA_STAGE_DIR` in that OS's native path
#     (e.g. Linux `/mnt/.../inka-stage`, Windows `C:\...\inka-stage`). Build
#     outputs cross jobs through that directory instead of artifacts.
#   - Linux: CARGO_HOME/CARGO_TARGET_DIR on a big disk, network (npm/deno for the
#     smoke test).
#   - Windows: Rust (x86_64-pc-windows-msvc), VS Build Tools, Git, and PowerShell
#     7 (`pwsh`). The core runtime needs no libclang.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
    outputs:
      rel: ${{ steps.versions.outputs.rel }}
      runtime: ${{ steps.versions.outputs.runtime }}
      channel: ${{ steps.versions.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare dirs
        run: |
          set -euo pipefail
          : "${CARGO_TARGET_DIR:?CARGO_TARGET_DIR must be set on the runner}"
          : "${CARGO_HOME:?CARGO_HOME must be set on the runner}"
          : "${INKA_STAGE_DIR:?INKA_STAGE_DIR must be set on the runner (shared with the Windows runner)}"
          STAGE="$INKA_STAGE_DIR/release-${{ github.run_id }}"
          mkdir -p "$CARGO_TARGET_DIR" "$STAGE"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          echo "CARGO_HOME=$CARGO_HOME"
          echo "STAGE=$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Deno pin drift
        run: scripts/ci/deno-pins.sh

      - name: Discover versions
        id: versions
        run: |
          set -euo pipefail
          out="$(scripts/ci/version.sh "${GITHUB_REF_NAME}")"
          REL="$(printf '%s\n' "$out" | sed -n 's/^release=//p')"
          RUNTIME="$(printf '%s\n' "$out" | sed -n 's/^runtime=//p')"
          DENO="$(printf '%s\n' "$out" | sed -n 's/^deno=//p')"
          CHANNEL="$(printf '%s\n' "$out" | sed -n 's/^channel=//p')"
          BASE="$(printf '%s\n' "$out" | sed -n 's/^base=//p')"
          [ -n "$REL" ] && [ -n "$RUNTIME" ] && [ -n "$DENO" ] \
            && [ -n "$CHANNEL" ] && [ -n "$BASE" ] \
            || { echo "error: could not parse version.sh output" >&2; exit 1; }
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "REL=$REL" >> "$GITHUB_ENV"
          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "DENO=$DENO" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "release=$REL runtime=$RUNTIME deno=$DENO channel=$CHANNEL base=$BASE"

      - name: Build toolchain
        run: |
          set -euo pipefail
          # Bake the release identity into inka/inka-launcher so `--version` and
          # channel defaults reflect the installed release, not the crate version.
          # INKA_BUILD_TAG lets `inka desktop --installer` pin the exact release
          # that serves the shared engine/CEF runtime.
          export INKA_BUILD_VERSION="$REL"
          export INKA_BUILD_COMMIT="${GITHUB_SHA:0:7}"
          export INKA_BUILD_TAG="$GITHUB_REF_NAME"
          cargo build --locked --release -p inka --features bundle
          cargo build --locked --release -p inka-launcher
          # Per-app desktop shim (cdylib); the laufey backends load it and it
          # forwards to the shared desktop-enabled runtime.
          cargo build --locked --release -p inka-desktop-shim

      - name: Build runtime (always; tuple = runtime-version)
        run: |
          set -euo pipefail
          # Desktop support is compiled into the shared runtime so every
          # desktop app reuses one engine; box needs libclang (bindgen).
          cargo build --locked --release -p inka-runtime --features desktop
          test -f "$CARGO_TARGET_DIR/release/libinka_runtime.so"

      - name: Stage release assets
        run: |
          set -euo pipefail
          BIN="$CARGO_TARGET_DIR/release"
          TC="inka-toolchain-${REL}-${TARGET}.tar.gz"

          # Toolchain binaries, packaged as one archive.
          cp "$BIN/inka" "$STAGE/inka"
          cp "$BIN/inka-launcher" "$STAGE/inka-launcher"
          cp "$BIN/libinka_desktop_shim.so" "$STAGE/libinka_desktop_shim.so"
          chmod +x "$STAGE/inka" "$STAGE/inka-launcher" "$STAGE/libinka_desktop_shim.so"
          tar -czf "$STAGE/$TC" -C "$STAGE" inka inka-launcher libinka_desktop_shim.so

          # Engine asset (always published; consumers keep only newer tuples).
          cp "$BIN/libinka_runtime.so" "$STAGE/libinka_runtime-$RUNTIME.so"

          # Shared CEF runtime: mirror the pinned laufey archive on this release
          # so `inka desktop --installer` can provision it without reaching
          # laufey's host, and verify it against the inka trust anchor.
          LAUFEY_VERSION="$(sed -n 's/.*const LAUFEY_VERSION: &str = "\([0-9][0-9.]*\)".*/\1/p' \
            crates/inka/src/desktop.rs | head -1)"
          CEF_ASSET="$(scripts/ci/laufey-asset.sh cef "$TARGET")"
          CEF_ARCHIVE="${CEF_ASSET%% *}"
          CEF_SHA="${CEF_ASSET##* }"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/littledivy/laufey/releases/download/v$LAUFEY_VERSION/$CEF_ARCHIVE" \
            -o "$STAGE/$CEF_ARCHIVE"
          GOT="$(sha256sum "$STAGE/$CEF_ARCHIVE" | awk '{print $1}')"
          [ "$GOT" = "$CEF_SHA" ] \
            || { echo "error: checksum mismatch for $CEF_ARCHIVE (pinned $CEF_SHA, got $GOT)" >&2; exit 1; }
          printf '%s\n' "$GOT" > "$STAGE/$CEF_ARCHIVE.sha256"

          # The bootstrap script and the curated release notes. The notes carry
          # {{REL}}/{{RUNTIME}} placeholders (substituted here) and a leading
          # maintainer comment block that is stripped from the published body.
          # Both values are validated to [0-9A-Za-z.+~-] (version.sh), so they
          # are safe as sed replacement text.
          cp install.sh "$STAGE/install.sh"
          # Beta releases use a beta-flavored body that names the exact tag and
          # how to install it; stable releases use the normal notes.
          NOTES=RELEASE_NOTES.md
          [ "$CHANNEL" = beta ] && NOTES=RELEASE_NOTES_BETA.md
          sed -e "s/{{REL}}/$REL/g" -e "s/{{RUNTIME}}/$RUNTIME/g" \
            -e "s/{{TAG}}/$GITHUB_REF_NAME/g" -e "s/{{CHANNEL}}/$CHANNEL/g" \
            "$NOTES" \
            | sed '1,/^-->$/d' > "$STAGE/RELEASE_NOTES.md"

          # sha256 sidecars (bare hex, as the installer/update expect).
          for f in "$TC" "libinka_runtime-$RUNTIME.so"; do
            (cd "$STAGE" && sha256sum "$f" | awk '{print $1}' > "$f.sha256")
          done

          # machine-readable version/identity record
          RT_SHA="$(cat "$STAGE/libinka_runtime-$RUNTIME.so.sha256")"
          TC_SHA="$(cat "$STAGE/$TC.sha256")"
          cat > "$STAGE/versions.json" <<EOF
          {
            "release": "$REL",
            "channel": "$CHANNEL",
            "base": "$BASE",
            "tag": "$GITHUB_REF_NAME",
            "toolchain": {
              "version": "$REL",
              "target": "$TARGET",
              "archive": "$TC",
              "sha256": "$TC_SHA"
            },
            "runtime": "$RUNTIME",
            "deno_runtime": "$DENO",
            "runtime_sha256": "$RT_SHA",
            "laufey": {
              "version": "$LAUFEY_VERSION",
              "target": "$TARGET",
              "backends": {
                "cef": {
                  "archive": "$CEF_ARCHIVE",
                  "sha256": "$CEF_SHA"
                }
              }
            }
          }
          EOF
          echo "staged:"; ls -1 "$STAGE"

      - name: Smoke test (never publish a broken release)
        run: scripts/ci/smoke.sh "$STAGE"

  # Windows core toolchain + runtime. Built without the `desktop` feature: the
  # core CLI (`run`/`build`/`update`) does not need laufey, so the runner avoids
  # libclang/bindgen. The Windows desktop runtime comes in a later release.
  #
  # Runner requirements: Rust (x86_64-pc-windows-msvc), VS Build Tools, Git, and
  # PowerShell 7 (`pwsh`).
  build-windows:
    needs: build
    # TODO: match the self-hosted Windows runner's labels.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Both runners share one stage directory (native path per OS). Fail fast
      # if the runner is not configured for it.
      - name: Prepare stage
        run: |
          if (-not $env:INKA_STAGE_DIR) {
            throw 'INKA_STAGE_DIR must be set on the runner (shared with the Linux runner)'
          }
          $stage = Join-Path $env:INKA_STAGE_DIR "release-${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build toolchain + runtime
        env:
          INKA_BUILD_VERSION: ${{ needs.build.outputs.rel }}
          INKA_BUILD_TAG: ${{ github.ref_name }}
        run: |
          $env:INKA_BUILD_COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          cargo build --locked --release -p inka --features bundle
          cargo build --locked --release -p inka-launcher
          cargo build --locked --release -p inka-desktop-shim
          cargo build --locked --release -p inka-runtime

      - name: Stage assets
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'target/release'
          $stage = $env:STAGE
          $rel = '${{ needs.build.outputs.rel }}'
          $runtime = '${{ needs.build.outputs.runtime }}'
          $tc = "inka-toolchain-$rel-x86_64-pc-windows-msvc.zip"
          Copy-Item "$bin/inka.exe" (Join-Path $stage 'inka.exe') -Force
          Copy-Item "$bin/inka-launcher.exe" (Join-Path $stage 'inka-launcher.exe') -Force
          Copy-Item "$bin/inka_desktop_shim.dll" (Join-Path $stage 'libinka_desktop_shim.dll') -Force
          $files = @(
            (Join-Path $stage 'inka.exe')
            (Join-Path $stage 'inka-launcher.exe')
            (Join-Path $stage 'libinka_desktop_shim.dll')
          )
          Compress-Archive -Force -DestinationPath (Join-Path $stage $tc) -Path $files
          $rtName = "libinka_runtime-$runtime.dll"
          Copy-Item "$bin/inka_runtime.dll" (Join-Path $stage $rtName) -Force
          Copy-Item 'install.ps1' (Join-Path $stage 'install.ps1') -Force
          $tcSha = (Get-FileHash -LiteralPath (Join-Path $stage $tc) -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath (Join-Path $stage "$tc.sha256") -Value $tcSha
          $rtSha = (Get-FileHash -LiteralPath (Join-Path $stage $rtName) -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath (Join-Path $stage "$rtName.sha256") -Value $rtSha

          # Merge the Linux record with a per-target map. Top-level keys stay
          # pointing at Linux so install.sh / older `inka update` keep working.
          $doc = Get-Content -LiteralPath (Join-Path $stage 'versions.json') -Raw | ConvertFrom-Json
          $targets = [ordered]@{}
          $targets['x86_64-unknown-linux-gnu'] = [ordered]@{
            toolchain      = $doc.toolchain
            runtime        = $doc.runtime
            runtime_sha256 = $doc.runtime_sha256
            laufey         = $doc.laufey
          }
          $targets['x86_64-pc-windows-msvc'] = [ordered]@{
            toolchain      = [ordered]@{ version = $rel; target = 'x86_64-pc-windows-msvc'; archive = $tc; sha256 = $tcSha }
            runtime        = $runtime
            runtime_sha256 = $rtSha
          }
          $doc | Add-Member -NotePropertyName targets -NotePropertyValue $targets -Force
          $doc | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $stage 'versions.json')

      - name: Smoke test
        run: '& "$PWD/scripts/ci/smoke.ps1" -Stage $env:STAGE'

  publish:
    needs: [build, build-windows]
    runs-on: self-hosted
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Resolve stage
        run: |
          set -euo pipefail
          : "${INKA_STAGE_DIR:?INKA_STAGE_DIR must be set on the runner}"
          echo "STAGE=$INKA_STAGE_DIR/release-${{ github.run_id }}" >> "$GITHUB_ENV"

      # No checkout and no package-manager code here: only the publish action.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: inka ${{ needs.build.outputs.rel }}
          body_path: ${{ env.STAGE }}/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.build.outputs.channel == 'beta' }}
          files: |
            ${{ env.STAGE }}/inka-toolchain-${{ needs.build.outputs.rel }}-${{ env.TARGET }}.tar.gz
            ${{ env.STAGE }}/inka-toolchain-${{ needs.build.outputs.rel }}-${{ env.TARGET }}.tar.gz.sha256
            ${{ env.STAGE }}/libinka_runtime-${{ needs.build.outputs.runtime }}.so
            ${{ env.STAGE }}/libinka_runtime-${{ needs.build.outputs.runtime }}.so.sha256
            ${{ env.STAGE }}/inka-toolchain-${{ needs.build.outputs.rel }}-x86_64-pc-windows-msvc.zip
            ${{ env.STAGE }}/inka-toolchain-${{ needs.build.outputs.rel }}-x86_64-pc-windows-msvc.zip.sha256
            ${{ env.STAGE }}/libinka_runtime-${{ needs.build.outputs.runtime }}.dll
            ${{ env.STAGE }}/libinka_runtime-${{ needs.build.outputs.runtime }}.dll.sha256
            ${{ env.STAGE }}/laufey-*.tar.gz
            ${{ env.STAGE }}/laufey-*.tar.gz.sha256
            ${{ env.STAGE }}/versions.json
            ${{ env.STAGE }}/install.sh
            ${{ env.STAGE }}/install.ps1
