# Release pipeline for inka.
#
# Triggered by every `v*` tag. On a self-hosted runner:
#   - builds the toolchain (inka, inka-launcher),
#   - builds the heavy runtime,
#   - builds a store snapshot,
#   - stages a toolchain tarball + engine assets + versions.json,
#   - smoke-tests the whole release through install.sh,
#   - publishes the assets as GitHub Release assets for the tag.
#
# Runner requirements:
#   - runs-on: self-hosted
#   - the runner's own environment provides CARGO_HOME and CARGO_TARGET_DIR
#     (a big disk; the Deno runtime build is ~10-15 min and needs several GB).
#   - network (npm install for the store snapshot).

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 300
    env:
      STAGE: ${{ github.workspace }}/_release_stage
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare dirs
        run: |
          set -euo pipefail
          : "${CARGO_TARGET_DIR:?CARGO_TARGET_DIR must be set on the runner}"
          : "${CARGO_HOME:?CARGO_HOME must be set on the runner}"
          mkdir -p "$CARGO_TARGET_DIR" "$STAGE"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          echo "CARGO_HOME=$CARGO_HOME"

      - name: Deno pin drift
        run: scripts/ci/deno-pins.sh

      - name: Discover versions
        run: |
          set -euo pipefail
          eval "$(scripts/ci/version.sh "${GITHUB_REF_NAME}")"
          echo "REL=$release" >> "$GITHUB_ENV"
          echo "RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "DENO=$deno" >> "$GITHUB_ENV"
          echo "release=$release runtime=$runtime deno=$deno"

      - name: Build toolchain
        run: |
          set -euo pipefail
          cargo build --release -p inka -p inka-launcher

      - name: Build runtime (always; tuple = runtime-version)
        run: |
          set -euo pipefail
          cargo build --release -p inka-runtime
          test -f "$CARGO_TARGET_DIR/release/libinka_runtime.so"

      - name: Build store snapshot
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/release/inka" internal snapshot-store \
            --seed-manifest seed-manifest.json \
            --out "$STAGE"
          test -f "$STAGE/store.tar.gz"

      - name: Stage release assets
        run: |
          set -euo pipefail
          BIN="$CARGO_TARGET_DIR/release"
          TC="inka-toolchain-${REL}-${TARGET}.tar.gz"

          # Toolchain binaries, packaged as one archive.
          cp "$BIN/inka" "$STAGE/inka"
          cp "$BIN/inka-launcher" "$STAGE/inka-launcher"
          chmod +x "$STAGE/inka" "$STAGE/inka-launcher"
          tar -czf "$STAGE/$TC" -C "$STAGE" inka inka-launcher

          # Engine asset (always published; consumers keep only newer tuples).
          cp "$BIN/libinka_runtime.so" "$STAGE/libinka_runtime-$RUNTIME.so"

          # The bootstrap script itself.
          cp install.sh "$STAGE/install.sh"

          # sha256 sidecars (bare hex, as the installer/update expect).
          for f in "$TC" "libinka_runtime-$RUNTIME.so" store.tar.gz; do
            (cd "$STAGE" && sha256sum "$f" | awk '{print $1}' > "$f.sha256")
          done

          # machine-readable version/identity record
          RT_SHA="$(cat "$STAGE/libinka_runtime-$RUNTIME.so.sha256")"
          TC_SHA="$(cat "$STAGE/$TC.sha256")"
          cat > "$STAGE/versions.json" <<EOF
          {
            "release": "$REL",
            "toolchain": {
              "version": "$REL",
              "target": "$TARGET",
              "archive": "$TC",
              "sha256": "$TC_SHA"
            },
            "runtime": "$RUNTIME",
            "deno_runtime": "$DENO",
            "runtime_sha256": "$RT_SHA"
          }
          EOF
          echo "staged:"; ls -1 "$STAGE"

      - name: Smoke test (never publish a broken release)
        run: scripts/ci/smoke.sh "$STAGE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: inka ${{ env.REL }}
          body: |
            inka ${{ env.REL }} — runtime tuple ${{ env.RUNTIME }} (deno_runtime ${{ env.DENO }}).

            ## Highlights

            - **Clean break from 0.3.x.** The import resolver was retired and the
              runtime tuple moved to ${{ env.RUNTIME }}. Re-run `install.sh`
              once: it detects a pre-0.4.0 install and resets the old toolchain,
              runtime, and store before provisioning 0.4.0 fresh. `inka update`
              alone will not cross this boundary.
            - **One resolution policy.** ESM `import` and CJS `require()` now
              share Deno's store-backed `NodeResolver`; `libinka_resolver-*.so`
              is no longer built, shipped, or installed.
            - **Native `.node` addons** load (opt-in via `ffi`/`sys`), and
              `--vendor-closure` now follows CommonJS `require()` too.

            ## Install

            ```sh
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | sh
            ```

            Then keep the toolchain, runtime, and store current with
            `inka update`.

            ## Assets

            - `inka-toolchain-${{ env.REL }}-${{ env.TARGET }}.tar.gz` — CLI + launcher
            - `libinka_runtime-${{ env.RUNTIME }}.so` — shared runtime tuple
            - `store.tar.gz` + `seed-manifest.json` — default-store snapshot
            - `install.sh` + `versions.json` — bootstrap installer + version record

            `.sha256` sidecars are published for the toolchain, runtime, and store
            archives.
          generate_release_notes: true
          draft: false
          files: |
            ${{ env.STAGE }}/inka-toolchain-${{ env.REL }}-${{ env.TARGET }}.tar.gz
            ${{ env.STAGE }}/inka-toolchain-${{ env.REL }}-${{ env.TARGET }}.tar.gz.sha256
            ${{ env.STAGE }}/libinka_runtime-${{ env.RUNTIME }}.so
            ${{ env.STAGE }}/libinka_runtime-${{ env.RUNTIME }}.so.sha256
            ${{ env.STAGE }}/store.tar.gz
            ${{ env.STAGE }}/store.tar.gz.sha256
            ${{ env.STAGE }}/seed-manifest.json
            ${{ env.STAGE }}/versions.json
            ${{ env.STAGE }}/install.sh
